name: Build APK

on:
  push:
    branches:
      - claude/github-access-request-jpjwv
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sideload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi

      - name: Create CI keystore
        run: |
          keytool -genkeypair -keystore arvio.jks -alias arvio \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI" -storepass 815787 -keypass 815787

      - name: Prepare app secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          cp secrets.defaults.properties secrets.properties
          set_secret() {
            if [ -n "$2" ]; then
              sed -i "s|^$1=.*|$1=$2|" secrets.properties
            fi
          }
          set_secret TMDB_API_KEY "$TMDB_API_KEY"
          set_secret SUPABASE_URL "$SUPABASE_URL"
          set_secret SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          set_secret TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          set_secret TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"

      - name: Build
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-sideload-debug
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
